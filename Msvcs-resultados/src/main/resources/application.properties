spring.application.name=Msvcs-resultados
server.port=8087

spring.datasource.url=jdbc:postgresql://localhost:5432/resultados
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/docs/swagger-ui.html
# Configuracion de Feign: timeout maximo de espera y activacion del circuit breaker
# para que el atributo fallback de los @FeignClient se ejecute en lugar de propagar error 500
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000
feign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.enabled=true

jwt.secret= ${JWT_SECRET:EsportsArenaManagerClaveSecretaJWT2026!}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
