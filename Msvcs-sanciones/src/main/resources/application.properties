spring.application.name=Msvcs-sanciones
server.port=8088

spring.datasource.url=jdbc:h2:file:./data/sanciones;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/docs/swagger-ui.html
# Configuracion de Feign: timeout maximo de espera y activacion del circuit breaker
# para que el atributo fallback de los @FeignClient se ejecute en lugar de propagar error 500
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000
feign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.enabled=true
