spring.application.name=Msvcs-inscripciones
server.port=8081
msvcs.torneos.url=http://localhost:8089
msvcs.equipos.url=http://localhost:8080
msvcs.sanciones.url=http://localhost:8088

spring.datasource.url=jdbc:h2:file:./data/incscripciones;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console