spring:
  application:
    name: Msvcs-gateway
    cloud:
      gateway:
        server:
          webmvc:
            # Cada ruta: si la URL entra por el patron 'predicates', el gateway la reenvia
            # a 'uri'. lb:// significa "busca este nombre en Eureka y balancea la carga".
            routes:
              - id: Msvcs-equipos
                uri: lb://msvcs-equipos
                predicates:
                  - Path=/api/v1/equipos/**,/api/v2/equipos/**
              - id: Msvcs-inscripciones
                uri: lb://msvcs-inscripciones
                predicates:
                  - Path=/api/v1/inscripciones/**,/api/v2/inscripciones/**
              - id: Msvcs-juegos
                uri: lb://msvcs-juegos
                predicates:
                  - Path=/api/v1/juegos/**,/api/v2/juegos/**
              - id: Msvcs-notificaciones
                uri: lb://msvcs-notificaciones
                predicates:
                  - Path=/api/v1/notificaciones/**,/api/v2/notificaciones/**
              - id: Msvcs-partidas
                uri: lb://msvcs-partidas
                predicates:
                  - Path=/api/v1/partidas/**,/api/v2/partidas/**
              - id: Msvcs-premios
                uri: lb://msvcs-premios
                predicates:
                  - Path=/api/v1/premios/**,/api/v2/premios/**
              - id: Msvcs-rankings
                uri: lb://msvcs-rankings
                predicates:
                  - Path=/api/v1/rankings/**,/api/v2/rankings/**
              - id: Mvsvcs-resultados
                uri: lb://msvcs-resultados
                predicates:
                  - Path=/api/v1/resultados/**,/api/v2/resultados/**
              - id: Msvcs-sanciones
                uri: lb://msvcs-sanciones
                predicates:
                  - Path=/api/v1/sanciones/**,/api/v2/sanciones/**
              - id: Msvcs-torneos
                uri: lb://msvcs-torneos
                predicates:
                  - Path=/api/v1/torneos/**,/api/v2/torneos/**
              - id: Msvcs-usuarios
                uri: lb://msvcs-usuarios
                predicates:
                  - Path=/api/v1/usuarios/**,/api/v2/usuarios/**

                  # Rutas para el OpenAPI (JSON) de cada microservicio. El Swagger UI del gateway
                # las consume. Usan el prefijo /api-docs/<svc> (NO /v3/api-docs) para no chocar con
                # el /v3/api-docs propio del gateway. RewritePath lo traduce al /v3/api-docs real del servicio.

              - id: equipos-api-docs
                uri: lb://msvcs-equipos
                predicates:
                  - Path=/api-docs/equipos
                filters:
                  - RewritePath=/api-docs/equipos, /v3/api-docs
              - id: inscripciones-api-docs
                uri: lb://msvcs-inscripciones
                predicates:
                  - Path=/api-docs/inscripciones
                filters:
                  - RewritePath=/api-docs/inscripciones, /v3/api-docs
              - id: juegos-api-docs
                uri: lb://msvcs-juegos
                predicates:
                  - Path=/api-docs/juegos
                filters:
                  - RewritePath=/api-docs/juegos, /v3/api-docs
              - id: notificaciones-api-docs
                uri: lb://msvcs-notificaciones
                predicates:
                  - Path=/api-docs/notificaciones
                filters:
                  - RewritePath=/api-docs/notificaciones, /v3/api-docs
              - id: partidas-api-docs
                uri: lb://msvcs-partidas
                predicates:
                  - Path=/api-docs/partidas
                filters:
                  - RewritePath=/api-docs/partidas, /v3/api-docs
              - id: premios-api-docs
                uri: lb://msvcs-premios
                predicates:
                  - Path=/api-docs/premios
                filters:
                  - RewritePath=/api-docs/premios, /v3/api-docs
              - id: rankings-api-docs
                uri: lb://msvcs-rankings
                predicates:
                  - Path=/api-docs/rankings
                filters:
                  - RewritePath=/api-docs/rankings, /v3/api-docs
              - id: resultados-api-docs
                uri: lb://msvcs-resultados
                predicates:
                  - Path=/api-docs/resultados
                filters:
                  - RewritePath=/api-docs/resultados, /v3/api-docs
              - id: sanciones-api-docs
                uri: lb://msvcs-sanciones
                predicates:
                  - Path=/api-docs/sanciones
                filters:
                  - RewritePath=/api-docs/sanciones, /v3/api-docs
              - id: torneos-api-docs
                uri: lb://msvcs-torneos
                predicates:
                  - Path=/api-docs/torneos
                filters:
                  - RewritePath=/api-docs/torneos, /v3/api-docs
              - id: usuarios-api-docs
                uri: lb://msvcs-usuarios
                predicates:
                  - Path=/api-docs/usuarios
                filters:
                  - RewritePath=/api-docs/usuarios, /v3/api-docs

# Punto de entrada unico: todo el trafico entra por aqui.
server:
  port: 8091

# El gateway tambien es cliente Eureka para poder resolver los lb://
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Swagger UI agregado: una sola pagina con un desplegable para elegir el microservicio.
springdoc:
  swagger-ui:
    enabled: true
    path: /docs/swagger-ui.html
    # El desplegable apunta a los docs de cada servicio (ruteados por el gateway via lb://).
    urls:
      - name: equipos
        url: /api-docs/equipos
      - name: inscripciones
        url: /api-docs/inscripciones
      - name: juegos
        url: /api-docs/juegos
      - name: notificaciones
        url: /api-docs/notificaciones
      - name: partidas
        url: /api-docs/partidas
      - name: premios
        url: /api-docs/premios
      - name: rankings
        url: /api-docs/rankings
      - name: resultados
        url: /api-docs/resultados
      - name: sanciones
        url: /api-docs/sanciones
      - name: torneos
        url: /api-docs/torneos
      - name: usuarios
        url: /api-docs/usuarios

# CLAVE SECRETA JWT: la MISMA que en msvc-usuarios y en los 3 microservicios. El gateway la usa para validar.
jwt:
  secret: Gamefloo@$&+()0